<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Костюм в фирменном зелёном. Светлый тон — осветлённый #1e7a57: на тёмно-зелёной
         карточке чистый фирменный даёт контраст 1,29:1 и попросту пропадает. -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3da97c" />
      <stop offset="100%" stop-color="#1e7a57" />
    </linearGradient>
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52bd93" />
      <stop offset="100%" stop-color="#2e8f6a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <!-- Галстук золотой: жёлтый gold-bright — фирменный акцент для тёмного фона,
         тень — золотой #d4a017 из той же палитры. -->
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd23f" />
      <stop offset="100%" stop-color="#d4a017" />
    </linearGradient>
  </defs>

  <style>
    /* Анимация приветственного махания руками */
    @keyframes waveLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes waveRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }
    /* Легкое покачивание головы для живости */
    @keyframes bobHead {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(2px) rotate(1deg); }
    }
    /* Движение галстука в такт */
    @keyframes swayTie {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3deg); }
    }

    .anim-left-arm {
      animation: waveLeft 1.2s ease-in-out infinite;
      transform-origin: 190px 210px;
    }
    .anim-right-arm {
      animation: waveRight 1.2s ease-in-out infinite;
      transform-origin: 310px 210px;
      /* Смещение фазы, чтобы махал естественно */
      animation-delay: 0.1s;
    }
    .anim-head {
      animation: bobHead 2.4s ease-in-out infinite;
      transform-origin: 250px 170px;
    }
    .anim-tie {
      animation: swayTie 2.4s ease-in-out infinite;
      transform-origin: 250px 210px;
    }
  </style>

  <g id="whiteboard">
    <line x1="180" y1="320" x2="160" y2="450" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
    <line x1="320" y1="320" x2="340" y2="450" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
    <line x1="250" y1="320" x2="250" y2="450" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    
    <rect x="130" y="120" width="240" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="6" />
    <rect x="126" y="116" width="248" height="208" rx="12" fill="none" stroke="#475569" stroke-width="8" />
    
    <path d="M 160 260 Q 200 200 240 230 T 320 170" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <circle cx="320" cy="170" r="6" fill="#10b981" />
    <path d="M 160 280 L 340 280" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5,5" />
  </g>

  <g id="manager">
    
    <path d="M 210 370 L 210 470 C 210 475, 235 475, 235 470 L 235 390 L 265 390 L 265 470 C 265 475, 290 475, 290 470 L 290 370 Z" fill="url(#suitGrad)" />
    
    <path d="M 180 230 Q 250 190 320 230 L 310 380 L 190 380 Z" fill="url(#suitGrad)" />
    
    <polygon points="235,200 265,200 250,230" fill="#ffffff" />
    
    <path d="M 220 215 L 280 215 L 280 340 L 250 360 L 220 340 Z" fill="url(#vestGrad)" />
    <circle cx="250" cy="250" r="3" fill="#94a3b8" />
    <circle cx="250" cy="275" r="3" fill="#94a3b8" />
    <circle cx="250" cy="300" r="3" fill="#94a3b8" />
    <circle cx="250" cy="325" r="3" fill="#94a3b8" />

    <g class="anim-tie">
      <path d="M 245 210 L 255 210 L 260 290 L 250 305 L 240 290 Z" fill="url(#tieGrad)" />
      <polygon points="243,205 257,205 250,215" fill="#d4a017" />
    </g>

    <path d="M 180 230 L 225 280 L 220 350 L 190 380 Z" fill="url(#suitGrad)" stroke="#0e4634" stroke-width="2" />
    <path d="M 320 230 L 275 280 L 280 350 L 310 380 Z" fill="url(#suitGrad)" stroke="#0e4634" stroke-width="2" />

    <g class="anim-left-arm">
      <path d="M 190 220 Q 140 180 145 130" fill="none" stroke="url(#suitGrad)" stroke-width="26" stroke-linecap="round" />
      <path d="M 145 130 L 146 120" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
      <path d="M 135 115 C 130 115, 125 105, 130 95 C 135 85, 145 80, 155 90 C 160 95, 160 105, 155 115 Z" fill="url(#skinGrad)" />
      <path d="M 138 92 Q 143 82 148 90" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round" />
      <path d="M 144 87 Q 149 77 154 87" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round" />
    </g>

    <g class="anim-right-arm">
      <path d="M 310 220 Q 360 180 355 130" fill="none" stroke="url(#suitGrad)" stroke-width="26" stroke-linecap="round" />
      <path d="M 355 130 L 354 120" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
      <path d="M 365 115 C 370 115, 375 105, 370 95 C 365 85, 355 80, 345 90 C 340 95, 340 105, 345 115 Z" fill="url(#skinGrad)" />
      <path d="M 362 92 Q 357 82 352 90" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round" />
      <path d="M 356 87 Q 351 77 346 87" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round" />
    </g>

    <g class="anim-head">
      <rect x="238" y="170" width="24" height="40" fill="url(#skinGrad)" rx="5" />
      
      <circle cx="250" cy="140" r="42" fill="url(#skinGrad)" />
      
      <path d="M 210 130 C 210 90, 290 90, 290 130 C 295 130, 290 110, 275 100 C 260 90, 220 100, 212 115 Z" fill="#451a03" />
      <path d="M 210 130 C 205 135, 208 150, 212 150 L 212 135 Z" fill="#451a03" /> <path d="M 290 130 C 295 135, 292 150, 288 150 L 288 135 Z" fill="#451a03" /> <path d="M 228 135 Q 235 128 242 135" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <path d="M 258 135 Q 265 128 272 135" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      
      <path d="M 225 125 Q 235 118 242 124" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
      <path d="M 275 125 Q 265 118 258 124" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />

      <circle cx="225" cy="148" r="6" fill="#f43f5e" opacity="0.4" />
      <circle cx="275" cy="148" r="6" fill="#f43f5e" opacity="0.4" />

      <path d="M 233 148 Q 250 175 267 148 Z" fill="#1e293b" />
      <path d="M 237 150 Q 250 158 263 150 L 260 148 L 240 148 Z" fill="#ffffff" />
      <path d="M 243 162 Q 250 155 257 162 Q 250 172 243 162" fill="#f43f5e" />
    </g>

  </g>
</svg>
