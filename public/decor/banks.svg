<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      .bank-stroke {
        stroke: #000000;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      /* fill-box обязателен: без него точкой отсчёта станет центр всего холста,
         и здания будут разъезжаться от него, а не расти на месте.
         Отсчёт от основания — здание приподнимается от земли, а не раздувается
         из середины, как это выглядело раньше. */
      .bank-group {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: bankLift 3.6s infinite ease-in-out;
      }

      @keyframes bankLift {
        0%, 55%, 100% { transform: translateY(0) scale(1); }
        18%, 37%      { transform: translateY(-5px) scale(1.05); }
      }

      /* Окна загораются, пока банк «смотрит заявку». На нашем размере здание
         занимает ~70px, и подъём на 5% почти незаметен, а смена цвета окон
         читается сразу — она и несёт анимацию. */
      .win {
        fill: #FFFFFF;
        animation: winOn 3.6s infinite ease-in-out;
      }

      @keyframes winOn {
        0%, 55%, 100% { fill: #FFFFFF; }
        18%, 37%      { fill: #FFD23F; }
      }

      /* Волна слева направо: заявка уходит в банки один за другим.
         Здание и его окна должны идти с одинаковой задержкой, иначе рассинхрон. */
      #bank-center, #bank-center .win { animation-delay: 0.55s; }
      #bank-right,  #bank-right .win  { animation-delay: 1.1s; }
    </style>
  </defs>

  <g id="bank-left" class="bank-group">
    <g transform="translate(100, 150)">
      <rect x="-60" y="40" width="120" height="15" fill="#A0A0A0" class="bank-stroke" />
      <rect x="-50" y="-40" width="100" height="80" fill="#D3D3D3" class="bank-stroke" />
      <polygon points="-55,-40 0,-70 55,-40" fill="#808080" class="bank-stroke" />
      <rect x="-35" y="-25" width="20" height="20" class="bank-stroke win" />
      <rect x="-35" y="5" width="20" height="20" class="bank-stroke win" />
      <rect x="15" y="-25" width="20" height="20" class="bank-stroke win" />
      <rect x="15" y="5" width="20" height="20" class="bank-stroke win" />
      <rect x="-10" y="10" width="20" height="30" fill="#4CAF50" class="bank-stroke" />
    </g>
  </g>

  <g id="bank-center" class="bank-group">
    <g transform="translate(300, 150)">
      <rect x="-70" y="45" width="140" height="15" fill="#808080" class="bank-stroke" />
      <rect x="-60" y="-50" width="120" height="95" fill="#4CAF50" class="bank-stroke" />
      <polygon points="-65,-50 0,-85 65,-50" fill="#E0E0E0" class="bank-stroke" />
      <rect x="-45" y="-50" width="10" height="95" class="bank-stroke win" />
      <rect x="-15" y="-50" width="10" height="95" class="bank-stroke win" />
      <rect x="15" y="-50" width="10" height="95" class="bank-stroke win" />
      <rect x="45" y="-50" width="10" height="95" class="bank-stroke win" />
      <rect x="-15" y="15" width="30" height="30" fill="#FFFFFF" class="bank-stroke" />
    </g>
  </g>

  <g id="bank-right" class="bank-group">
    <g transform="translate(500, 150)">
      <rect x="-55" y="40" width="110" height="15" fill="#D3D3D3" class="bank-stroke" />
      <rect x="-45" y="-60" width="90" height="100" fill="#FFFFFF" class="bank-stroke" />
      <rect x="30" y="-60" width="15" height="100" fill="#4CAF50" class="bank-stroke" />
      <rect x="-30" y="-45" width="15" height="15" class="bank-stroke win" />
      <rect x="-30" y="-20" width="15" height="15" class="bank-stroke win" />
      <rect x="-30" y="5" width="15" height="15" class="bank-stroke win" />
      <rect x="0" y="-45" width="15" height="15" class="bank-stroke win" />
      <rect x="0" y="-20" width="15" height="15" class="bank-stroke win" />
      <rect x="0" y="5" width="15" height="15" class="bank-stroke win" />
      <rect x="-10" y="20" width="20" height="20" fill="#A0A0A0" class="bank-stroke" />
    </g>
  </g>
</svg>
