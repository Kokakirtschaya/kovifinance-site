<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7DED9" />
      <stop offset="100%" stop-color="#A9B5AF" />
    </linearGradient>
  </defs>

  <style>
    /* Анимация бегущих точек (потоков данных) */
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: flow 1.5s linear infinite;
    }
    @keyframes flow {
      to {
        stroke-dashoffset: -16;
      }
    }

    /* Анимация звонка телефона (вибрация и волны) */
    .phone-bubble {
      transform-origin: 120px 200px;
      animation: phone-shake 1.5s infinite ease-in-out;
    }
    @keyframes phone-shake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      10%, 30%, 50%, 70%, 90% { transform: rotate(-4deg) scale(1.02); }
      20%, 40%, 60%, 80% { transform: rotate(4deg) scale(1.02); }
    }
    .wave-left, .wave-right {
      /* Без fill-box точкой отсчёта станет центр холста (250,250), а не сама волна:
         вместо пульсации на месте её будет мотать на 20–30px вокруг телефона. */
      transform-box: fill-box;
      transform-origin: center;
      animation: wave-pulse 1s infinite alternate ease-in-out;
    }
    @keyframes wave-pulse {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* Анимация подписи договора (движение ручки) */
    .anim-pen {
      transform-origin: 383px 212px;
      animation: pen-scribble 1.8s infinite ease-in-out;
    }
    @keyframes pen-scribble {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 2px) rotate(-8deg); }
      40% { transform: translate(2px, -3px) rotate(5deg); }
      60% { transform: translate(-2px, -1px) rotate(-4deg); }
      80% { transform: translate(3px, 1px) rotate(6deg); }
    }

    /* Анимация успешного закрытия сделки */
    .deal-bubble {
      transform-origin: 250px 100px;
      animation: deal-pulse 2.5s infinite ease-in-out;
    }
    @keyframes deal-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(30, 122, 87, 0.2)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 4px 12px rgba(30, 122, 87, 0.4)); }
    }
    .star-1 {
      transform-origin: 215px 81px;
      animation: spin-star 5s infinite linear;
    }
    .star-2 {
      transform-origin: 285px 81px;
      animation: spin-star 5s infinite linear reverse;
    }
    @keyframes spin-star {
      0% { transform: scale(0.8) rotate(0deg); opacity: 0.6; }
      50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
      100% { transform: scale(0.8) rotate(360deg); opacity: 0.6; }
    }

    /* Анимация кивающих мыслей менеджера */
    .manager-head {
      transform-origin: 250px 270px;
      animation: nod 4s infinite ease-in-out;
    }
    @keyframes nod {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(3px) rotate(1deg); }
    }

    /* Анимация бешеной работы рук (печать на клавиатуре) */
    .left-arm {
      transform-origin: 225px 330px;
      animation: type-left 0.15s infinite alternate ease-in-out;
    }
    @keyframes type-left {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-4px) rotate(-3deg); }
    }
    .right-arm {
      transform-origin: 275px 330px;
      animation: type-right 0.18s infinite alternate ease-in-out;
    }
    @keyframes type-right {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-5px) rotate(3deg); }
    }

    /* Свечение экрана */
    .screen-glow {
      transform-origin: 250px 344px;
      animation: pulse-glow 2s infinite alternate ease-in-out;
    }
    @keyframes pulse-glow {
      0% { opacity: 0.8; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1.03); }
    }
  </style>

  <g>
    <path class="flow-line" d="M 220 340 Q 150 320 120 245" fill="none" stroke="#6FC9A3" stroke-width="3" />
    <path class="flow-line" d="M 250 315 L 250 145" fill="none" stroke="#FFD23F" stroke-width="3" />
    <path class="flow-line" d="M 280 340 Q 350 320 380 245" fill="none" stroke="#D4A017" stroke-width="3" />
  </g>

  <g class="manager-group">
    <rect x="120" y="380" width="260" height="8" rx="4" fill="#D7DED9" />

    <path d="M215,380 L285,380 L275,315 L225,315 Z" fill="#3DA97C" />
    
    <polygon points="243,315 257,315 250,335" fill="#D4A017" />
    <line x1="250" y1="335" x2="250" y2="360" stroke="#D4A017" stroke-width="3" stroke-linecap="round" />
    
    <rect x="243" y="298" width="14" height="18" fill="#FEEBC8" />

    <g class="manager-head">
      <circle cx="250" cy="270" r="32" fill="#FEEBC8" />
      <path d="M218,270 A 32 32 0 0 1 282 270 Z" fill="#08130E" />
      <path d="M218,270 Q 235,255 250,270 Q 265,255 282,270 Z" fill="#08130E" />
      <!-- Контровая кромка по причёске: тёмные волосы на тёмной карточке дают контраст
           1,0–1,5:1 при любом оттенке — силуэт головы пропадает. Светлая линия по контуру
           отделяет её от фона, осветлять сами волосы при этом не нужно. -->
      <path d="M218,270 A 32 32 0 0 1 282 270" fill="none" stroke="#D7DED9" stroke-width="2.5" stroke-linecap="round" />
      <rect x="230" y="265" width="16" height="12" rx="3" fill="none" stroke="#0E4634" stroke-width="2" />
      <rect x="254" y="265" width="16" height="12" rx="3" fill="none" stroke="#0E4634" stroke-width="2" />
      <line x1="246" y1="271" x2="254" y2="271" stroke="#0E4634" stroke-width="2" />
      <path d="M245,285 Q250,291 255,285" fill="none" stroke="#0E4634" stroke-width="2" stroke-linecap="round" />
    </g>

    <path d="M225,330 Q 200,345 225,372" fill="none" stroke="#3DA97C" stroke-width="12" stroke-linecap="round" class="left-arm" />
    <path d="M275,330 Q 300,345 275,372" fill="none" stroke="#3DA97C" stroke-width="12" stroke-linecap="round" class="right-arm" />

    <polygon points="190,380 310,380 295,368 205,368" fill="#BFC9C3" />
    <rect x="210" y="320" width="80" height="48" rx="4" fill="url(#laptopGrad)" />
    <rect x="215" y="324" width="70" height="40" rx="2" fill="#08130E" />
    <circle cx="250" cy="344" r="14" fill="#3DA97C" class="screen-glow" opacity="0.9" />
    <path d="M244,344 L248,348 L256,340" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g class="phone-bubble">
    <circle cx="120" cy="200" r="42" fill="#F2EFE8" stroke="#3DA97C" stroke-width="3" />
    <rect x="106" y="180" width="28" height="40" rx="5" fill="#3DA97C" />
    <rect x="110" y="185" width="20" height="28" fill="#FFFFFF" />
    <circle cx="120" cy="216" r="1.5" fill="#FFFFFF" />
    <path d="M96,192 A 12 12 0 0 0 96 208" fill="none" stroke="#3DA97C" stroke-width="3" stroke-linecap="round" class="wave-left" />
    <path d="M144,192 A 12 12 0 0 1 144 208" fill="none" stroke="#3DA97C" stroke-width="3" stroke-linecap="round" class="wave-right" />
  </g>

  <g class="contract-bubble">
    <circle cx="380" cy="200" r="42" fill="#F2EFE8" stroke="#D4A017" stroke-width="3" />
    <rect x="365" y="178" width="30" height="40" rx="3" fill="#FFFFFF" stroke="#D4A017" stroke-width="2" />
    <line x1="371" y1="187" x2="389" y2="187" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round" />
    <line x1="371" y1="195" x2="389" y2="195" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round" />
    <line x1="371" y1="203" x2="381" y2="203" stroke="#D9CBA3" stroke-width="2" stroke-linecap="round" />
    <path d="M371,209 Q376,213 381,208 T389,211" fill="none" stroke="#3DA97C" stroke-width="1.5" />
    <g class="anim-pen">
      <polygon points="383,212 393,195 397,197 387,214" fill="#0E4634" />
      <polygon points="383,212 384,210 387,214" fill="#D4A017" />
    </g>
  </g>

  <g class="deal-bubble">
    <circle cx="250" cy="100" r="42" fill="#E7F2EC" stroke="#1E7A57" stroke-width="3" />
    <path d="M234,100 L245,111 L268,87" fill="none" stroke="#1E7A57" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M215,75 L217,80 L222,80 L218,83 L220,88 L215,85 L210,88 L212,83 L208,80 L213,80 Z" fill="#FFD23F" class="star-1" />
    <path d="M285,75 L287,80 L292,80 L288,83 L290,88 L285,85 L280,88 L282,83 L278,80 L283,80 Z" fill="#FFD23F" class="star-2" />
  </g>
</svg>
